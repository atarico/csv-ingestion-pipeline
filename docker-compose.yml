services:
  postgres:
    image: postgres:18-alpine
    container_name: carbonbox-postgres
    environment:
      POSTGRES_DB: document_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ images require the mount at /var/lib/postgresql (not /data);
      # a mount at /var/lib/postgresql/data makes the container exit at startup.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.14.0
    container_name: carbonbox-localstack
    environment:
      SERVICES: s3,sqs
      SQS_ENDPOINT_STRATEGY: "off"
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # Ready only once the init hook (queues/bucket) has completed, not just when LocalStack is up.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_processing
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env.docker
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["node", "dist/workers/index.js"]
    env_file: ./backend/.env.docker
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
